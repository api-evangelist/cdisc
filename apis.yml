- aid: cdisc:cdisc-dataset-json-api
  name: CDISC Dataset-JSON API (standard specification)
  description: >-
    CDISC-authored OpenAPI 3.1 specification for the Dataset-JSON API — studies, snapshots, datasets (including
    an NDJSON streaming representation and an $export operation) and Define-XML documents. This is a SPECIFICATION
    CDISC publishes for implementers to host, not a service CDISC operates: the contract declares no servers and
    CDISC runs no endpoint for it, which is why no baseURL is recorded.
  humanURL: https://www.cdisc.org/standards/data-exchange/dataset-json
  tags:
  - Dataset-JSON
  - Data Exchange
  - Standards
  properties:
