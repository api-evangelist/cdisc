- aid: cdisc:cdisc-analysis-results-api
  name: CDISC Analysis Results Standard (ARS) API
  description: >-
    The Analysis Results Standard surface of the CDISC Library API — 17 read operations that expose published
    ARS packages and their reporting events: planned analyses, analysis sets, data subsets, groupings,
    statistical methods and their operations, outputs, displays and categorizations. Served from the same
    production host and behind the same api-key as the rest of the CDISC Library.
  humanURL: https://www.cdisc.org/standards/foundational/analysis-results-standards
  baseURL: https://library.cdisc.org/api
  tags:
  - Analysis Results
  - Clinical Trials
