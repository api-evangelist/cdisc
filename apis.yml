description: >-
  CDISC Library uses linked data and a REST API to deliver CDISC standards metadata to software applications that
  automate standards-based processes. CDISC Library provides access to new relationships between standards as well as a
  substantially increased number of versioned CDISC standards and controlled terminology packages.
