    - path: /mdr/ct/{packageDate}/codelists
      name: listcodelists
      operations:
      - method: GET
        name: listcodelists
        description: List codelists in a terminology package
        call: cdisc.listcodelists
        with:
          packageDate: rest.packageDate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: cdisc-mcp
    transport: http
    description: MCP adapter for CDISC Library API for AI agent use.
