naftiko: 1.0.0-alpha2
info:
  label: CDISC Library API — CDASH
  description: 'CDISC Library API — CDASH. 1 operations. Lead operation: List all CDASH standard versions. Self-contained
    Naftiko capability covering one Cdisc business surface.'
  tags:
  - Cdisc
  - CDASH
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CDISC_API_KEY: CDISC_API_KEY
capability:
  consumes:
  - type: http
    namespace: library-cdash
    baseUri: https://library.cdisc.org/api
    description: CDISC Library API — CDASH business capability. Self-contained, no shared references.
    resources:
    - name: mdr-cdash
      path: /mdr/cdash
      operations:
      - name: listcdashversions
        method: GET
        description: List all CDASH standard versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: api-key
      value: '{{env.CDISC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: library-cdash-rest
    port: 8080
    description: REST adapter for CDISC Library API — CDASH. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/mdr/cdash
      name: mdr-cdash
      description: REST surface for mdr-cdash.
      operations:
      - method: GET
        name: listcdashversions
        description: List all CDASH standard versions
        call: library-cdash.listcdashversions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: library-cdash-mcp
    port: 9090
    transport: http
    description: MCP adapter for CDISC Library API — CDASH. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-cdash-standard-versions
      description: List all CDASH standard versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: library-cdash.listcdashversions
      outputParameters:
      - type: object
        mapping: $.
