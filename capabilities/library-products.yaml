naftiko: 1.0.0-alpha2
info:
  label: CDISC Library API — Products
  description: 'CDISC Library API — Products. 1 operations. Lead operation: List all CDISC standards products. Self-contained
    Naftiko capability covering one Cdisc business surface.'
  tags:
  - Cdisc
  - Products
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CDISC_API_KEY: CDISC_API_KEY
capability:
  consumes:
  - type: http
    namespace: library-products
    baseUri: https://library.cdisc.org/api
    description: CDISC Library API — Products business capability. Self-contained, no shared references.
    resources:
    - name: mdr-products
      path: /mdr/products
      operations:
      - name: listproducts
        method: GET
        description: List all CDISC standards products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Accept
          in: header
          type: string
          description: Response format (application/json, application/xml, text/csv)
    authentication:
      type: apikey
      key: api-key
      value: '{{env.CDISC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: library-products-rest
    port: 8080
    description: REST adapter for CDISC Library API — Products. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/mdr/products
      name: mdr-products
      description: REST surface for mdr-products.
      operations:
      - method: GET
        name: listproducts
        description: List all CDISC standards products
        call: library-products.listproducts
        with:
          Accept: rest.Accept
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: library-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for CDISC Library API — Products. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-cdisc-standards-products
      description: List all CDISC standards products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: library-products.listproducts
      with:
        Accept: tools.Accept
      outputParameters:
      - type: object
        mapping: $.
