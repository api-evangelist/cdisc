note: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted three tiers of limits (10 rpm free burst
  20, and a monthly quota) and a full X-RateLimit-* header set. CDISC publishes none of that. The invented
  values are removed rather than kept alongside the finding.
