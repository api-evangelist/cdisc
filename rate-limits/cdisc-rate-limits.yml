description: >-
  No rate limit is published for the CDISC Library API, and none is signalled at runtime. A live request to
  https://library.cdisc.org/api/mdr/products returned 401 with Date, Content-Type, Content-Length, Connection,
  Request-Context and WWW-Authenticate — and no RateLimit-*, X-RateLimit-* or Retry-After header. The API
  documentation page carries no limits; the CDISC Library knowledge base, where an operational limit would most
  likely be stated, is behind a Cloudflare bot challenge and could not be read by a machine. The gateway is
  Azure API Management, which CAN enforce per-subscription quotas, so an undocumented limit may well exist —
  this records that a consumer has no published way to know it.
