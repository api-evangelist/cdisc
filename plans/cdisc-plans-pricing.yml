description: >-
  CDISC publishes NO priced plans, tiers, quotas or overages for the CDISC Library API. Access is granted by
  account, not purchased by tier: a CDISC Library account is requested at
  https://www.cdisc.org/cdisc-library/api-account-request and the API key is then issued from the Azure API
  Management developer portal. The contract's own license block names the eligible populations — "License for
  CDISC Members & Open Source Developers". CDISC is a 501(c)(3) non-profit; what is priced is organisational
  MEMBERSHIP (rates published at https://www.cdisc.org/membership/rates-benefits), and membership is a
  prerequisite for some content, not a metered API plan. Recording plan_count: 0 is the honest measurement.
plans: []
access:
  model: account-gated
  eligibility:
    - CDISC member organisations
    - Open-source developers
  request_url: https://www.cdisc.org/cdisc-library/api-account-request
  key_issuance: https://api.developer.library.cdisc.org/
  membership_rates: https://www.cdisc.org/membership/rates-benefits
note: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that carried invented tiers (a "Free" plan with a 1,000
  request/month quota and a 10 rpm limit). None of those numbers was ever published by CDISC. They are removed
  rather than corrected: a fabricated plan is worse than a recorded zero.
