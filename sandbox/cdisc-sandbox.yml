description: >-
  CDISC publishes no sandbox: there is no test environment, no test key prefix, no fixture data and no
  time-simulation tooling for the CDISC Library API. What exists is an interactive console inside the Azure API
  Management developer portal, and it is account-gated — an anonymous visitor is redirected to /signin, so it
  cannot be used to evaluate the API before approval. Recorded for completeness; no Sandbox pointer is emitted,
  because a console you cannot reach without an approved account is not a sandbox.
